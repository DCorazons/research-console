# Monitoring stack of the thesis experiment (proposal, table 3.4 and section 3.2.4).
# Runs on CPU 0 with k6 and the research console; the application stacks run on CPU 1.
# Every port is bound to 127.0.0.1: k6 and the console reach it on the same VPS.
#
#   InfluxDB 1.x  metrics of k6 (k6 run --out influxdb=http://127.0.0.1:8086/k6);
#                 1.x because the built-in k6 output speaks the InfluxDB v1 API.
#   cAdvisor      CPU and memory of the containers, only cpu and memory collected.
#   Prometheus    stores the cAdvisor metrics of the research-* containers.
#
# Start once and keep running across runs:
#   docker compose -f monitoring/docker-compose.yml up -d
name: research-monitoring

services:
  influxdb:
    image: influxdb:1.11.8
    cpuset: "0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_REPORTING_DISABLED: "true"
      # No log line per write or query: k6 writes every second during a run
      INFLUXDB_HTTP_LOG_ENABLED: "false"
      INFLUXDB_DATA_QUERY_LOG_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    cpuset: "0"
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --enable_metrics=cpu,memory
      - --housekeeping_interval=5s
      - --store_container_labels=false
    ports:
      # Only for checking by hand; Prometheus scrapes it on the compose network
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    cpuset: "0"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor

volumes:
  influxdb-data:
  prometheus-data:
